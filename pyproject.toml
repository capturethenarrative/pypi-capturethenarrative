[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capturethenarrative"
version = "0.4.0"
description = "Python client for the Capture the Narrative game world: Legit Social, the in-universe news sites and the competition LLM"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Capture the Narrative" }]
keywords = ["capturethenarrative", "capture-the-narrative", "ctn", "legit-social", "competition", "bot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Education",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["openai>=1.0"]

[project.urls]
Homepage = "https://capturethenarrative.com"
Source = "https://github.com/capturethenarrative/pypi-capturethenarrative"

[tool.setuptools.packages.find]
where = ["src"]
